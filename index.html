<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;700&family=Source+Sans+Pro:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>

  <body>
    <header>
      <h1>The Gallery Interactive</h1>
      <i class="ph ph-arrow-down-right"></i>
    </header>

    <main class="grid">
      <div class="model-1 grid">
        <div class="container">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=1"
            alt="Abstract Name 1"
          />
          <span>Abstract Name 1</span>
        </div>

        <div class="container">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=2"
            alt="Abstract Name 2"
          />
          <span>Abstract Name 2</span>
        </div>

        <div class="container">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=3"
            alt="Abstract Name 3"
          />
          <span>Abstract Name 3</span>
        </div>

        <div class="container horizontal">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=4"
            alt="Abstract Name 4"
          />
          <span>Abstract Name 4</span>
        </div>
      </div>

      <div class="model-2 grid">
        <div class="container">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=5"
            alt="Abstract Name 5"
          />
          <span>Abstract Name 5</span>
        </div>

        <div class="container">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=6"
            alt="Abstract Name 6"
          />
          <span>Abstract Name 6</span>
        </div>

        <div class="container">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=7"
            alt="Abstract Name 7"
          />
          <span>Abstract Name 7</span>
        </div>

        <div class="container horizontal">
          <img
            loading="lazy"
            src="https://picsum.photos/800/600?random=8"
            alt="Abstract Name 8"
          />
          <span>Abstract Name 8</span>
        </div>
      </div>
    </main>
  </body>
</html>
